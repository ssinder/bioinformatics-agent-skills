name: Script Syntax & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: Python syntax check
    strategy:
      fail-fast: false
      matrix:
        # include 而非单纯的版本列表：Python 3.9 在 Ubuntu 24.04 之后的
        # runner 镜像里已被移除（actions/setup-python 会报
        # "The version '3.9' with architecture 'x64' was not found"），
        # 所以它必须跑在仍提供 3.9 的 ubuntu-22.04 上。
        #
        # 本项目声明支持 Python 3.9（pyproject 的 requires-python），
        # 因此这条检查要保留——它守护的是"在 3.9 上不出现 PEP 604
        # 之类的语法错误"，而本地无法覆盖。
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python files
        run: python -m compileall -q skills packages scripts tests

      - name: Check every skill entry script exposes --help
        run: |
          set -e
          # 复用校验器的库模块判定逻辑，避免在 CI 中维护第二份重复实现。
          # 库模块（core/helper/utils/properties/filters 等）由其他脚本 import 调用，
          # 本就不需要 __main__ 入口。
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from validate_skills import _is_library_module

          failures = []
          for entry in sorted(Path("skills").glob("*/scripts/*.py")):
              source = entry.read_text(encoding="utf-8")
              if _is_library_module(source, entry.name):
                  print(f"lib  {entry}")
              elif "bootstrap_cli" in source or "argparse" in source or "--help" in source:
                  print(f"ok   {entry}")
              else:
                  failures.append(f"MISSING CLI: {entry}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("\nall scripts expose a CLI entry or are declared library modules")
          PY

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check skills packages scripts tests

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 在 Ubuntu 24.04 之后的 runner 镜像里已被移除
        # （actions/setup-python 报 "version '3.9' ... was not found"），
        # 因此它跑在仍提供 3.9 的 ubuntu-22.04 上。
        # 项目声明支持 3.9（requires-python），所以这条检查必须保留。
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Check test fixtures are committed
        # 关键回归：夹具被 .gitignore 排除时，本地 pytest 全绿
        # （文件在工作区里）但 CI 全挂（clone 后没有）——
        # 这个检查能在跑 pytest 之前就报出准确原因。
        run: python scripts/ci_check_fixtures.py

      - name: Run pytest
        run: pytest tests -v --tb=short

  integration:
    name: Skill smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Smoke test every skill entry point
        run: |
          set -e
          python - <<'PY'
          import subprocess, sys
          from bioagent.registry import REGISTRY

          failures = []
          for spec in REGISTRY.values():
              entry = spec.entry_path
              if not entry.exists():
                  failures.append(f"{spec.name}: missing {entry}")
                  continue
              proc = subprocess.run(
                  [sys.executable, str(entry), "--help"],
                  capture_output=True, text=True, timeout=120,
              )
              if proc.returncode != 0:
                  failures.append(f"{spec.name}: --help exited {proc.returncode}\n{proc.stderr[-500:]}")
              else:
                  print(f"ok  {spec.name}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"\nall {len(REGISTRY)} skills respond to --help")
          PY

      - name: Smoke test every skill entry point without scientific stack
        # 关键回归：--help 属于元信息查询，不应因为缺少 numpy / pandas 等
        # 科学计算栈而崩溃。技能脚本必须在缺依赖时优雅降级。
        run: python scripts/ci_smoke_no_deps.py

  backend-agreement:
    name: Backend agreement (DESeq2 reference)
    # 对照官方参考实现，验证内置纯 Python 统计实现没有系统性偏差。
    #
    # 这是本仓库科学正确性的核心证据：技能在 SKILL.md 里承诺
    # "同一数据用 --backend python 与 --backend r 各跑一次结果基本一致"，
    # 那就必须由 CI 真跑一遍，而不是只在文档里这么写。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R and Bioconductor DESeq2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-base-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            build-essential gfortran \
            libglpk-dev libblas-dev liblapack-dev
          # Bioconductor 的 DESeq2 从 BiocManager 装。
          #
          # **不要锁 Bioconductor 版本**：每个 Bioc 大版本绑定一个 R 版本
          # （3.20 要求 R 4.4，3.22 要求 R 4.5…），而 runner 镜像里的
          # R 版本会变——写死版本会在 R 升级后直接失败：
          #   "Bioconductor version '3.20' requires R version '4.4'"
          #
          # BiocManager 会自动选与当前 R 匹配的 Bioc 版本。
          # 这**不**影响对照测试的有效性：对照的是"内置实现 vs 官方实现"，
          # 而 DESeq2 的核心算法（size factor 归一化、离散度估计、Wald 检验）
          # 在这些版本间是稳定的。
          sudo Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org")'
          sudo Rscript -e 'BiocManager::install("DESeq2", ask=FALSE, update=FALSE)'
          Rscript -e 'cat("R:", R.version.string, "\n")'
          Rscript -e 'cat("Bioconductor:", as.character(BiocManager::version()), "\n")'
          Rscript -e 'cat("DESeq2 available:", requireNamespace("DESeq2", quietly=TRUE), "\n")'

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install numpy scipy pandas

      - name: Verify both backends agree
        # 关键：这里必须真的跑对照，而不是跳过。
        # ci_verify_backend.py 会先探测参考实现是否可用，
        # 不可用就直接失败；可用则跑 pytest，并把跳过数也视为失败——
        # 否则这个 job 会变成一个永不验证的摆设徽章。
        run: |
          python scripts/ci_verify_backend.py \
            --reference deseq2 \
            --test tests/test_backend_agreement.py

  scrna-backend-agreement:
    name: Backend agreement (scanpy reference)
    # 单细胞流程同样有双后端：内置纯 NumPy 实现 vs scanpy。
    # 夹具里带有人工真值聚类，因此除了两后端互比，还能验证各自
    # 对真值的还原度——两个实现可能一起错，但对上真值就说明没错。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          # scanpy 后端对照需要 scanpy + anndata + leidenalg。
          # 注意 igraph 的版本兼容：leidenalg 0.12 与 igraph 1.0 不兼容
          # （"Graph has no attribute 'Weighted_AdjacencyMatrix'"），
          # 而 leidenalg 声明支持 igraph>=1.0 —— 上游的声明与实际不符，
          # 所以这里显式锁 igraph<1.0。
          #
          # 本仓库的 cluster_leiden 已同时适配 igraph 的新旧 API
          # （Weighted_AdjacencyMatrix / Weighted_Adjacency），
          # 但 leidenalg 自身仍用旧名，因此锁版本更稳妥。
          pip install "scanpy>=1.9" "anndata>=0.9" matplotlib leidenalg "igraph<1.0"

      - name: Verify both backends agree
        run: |
          python scripts/ci_verify_backend.py \
            --reference scanpy \
            --test tests/test_scrna_backend_agreement.py


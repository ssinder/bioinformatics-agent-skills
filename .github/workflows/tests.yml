name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests -v --tb=short

  integration:
    name: Skill smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Smoke test every skill entry point
        run: |
          set -e
          python - <<'PY'
          import subprocess, sys
          from biopipe.registry import REGISTRY

          failures = []
          for spec in REGISTRY.values():
              entry = spec.entry_path
              if not entry.exists():
                  failures.append(f"{spec.name}: missing {entry}")
                  continue
              proc = subprocess.run(
                  [sys.executable, str(entry), "--help"],
                  capture_output=True, text=True, timeout=120,
              )
              if proc.returncode != 0:
                  failures.append(f"{spec.name}: --help exited {proc.returncode}\n{proc.stderr[-500:]}")
              else:
                  print(f"ok  {spec.name}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"\nall {len(REGISTRY)} skills respond to --help")
          PY

      - name: Smoke test every skill entry point without scientific stack
        # 关键回归：--help 属于元信息查询，不应因为缺少 numpy / pandas 等
        # 科学计算栈而崩溃。技能脚本必须在缺依赖时优雅降级。
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/no_deps"
          cat > "$RUNNER_TEMP/no_deps/sitecustomize.py" <<'PYBLOCK'
          import sys


          class _Blocker:
              BLOCKED = {"numpy", "pandas", "scipy", "matplotlib", "seaborn"}

              def find_module(self, name, path=None):
                  return self if name.split(".")[0] in self.BLOCKED else None

              def load_module(self, name):
                  raise ImportError("blocked for CI smoke test: " + name)


          sys.meta_path.insert(0, _Blocker())
          PYBLOCK
          PYTHONPATH="$RUNNER_TEMP/no_deps:$PWD/packages" python - <<'PY'
          import subprocess, sys, os
          from pathlib import Path

          failures = []
          for entry in sorted(Path("skills").glob("*/scripts/*.py")):
              proc = subprocess.run(
                  [sys.executable, str(entry), "--help"],
                  capture_output=True, text=True, timeout=120,
              )
              if proc.returncode != 0:
                  failures.append(f"{entry}: exit {proc.returncode}\n{proc.stderr[-400:]}")

          if failures:
              print("以下脚本在无科学计算栈环境下 --help 失败：")
              print("\n".join(failures))
              raise SystemExit(1)
          print("all scripts respond to --help without numpy/pandas/scipy")
          PY

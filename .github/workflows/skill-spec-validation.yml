name: Skill Spec Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Validate skill spec compliance
        run: python scripts/validate_skills.py

      - name: Check cross-harness compatibility
        # 检查技能在 Claude Code / Codex / Copilot CLI 等宿主下能否被加载：
        # description 超限会让整个技能静默不加载，frontmatter 含规范外
        # 字段会让 claude.ai 上传直接失败。
        run: python scripts/ci_harness_check.py

      - name: Check skill evaluation cases
        # 每个技能必须有 evals/evals.json，且至少含一个近似负例
        # （should_not_trigger）——没有负例就测不出"该不该用这个技能"，
        # 技能之间会互相抢触发。
        run: python scripts/ci_check_evals.py --require-all

      - name: Verify version consistency
        # plugin.json / pyproject.toml / CITATION.cff 三处版本必须一致，
        # 否则发布出去的 wheel、插件清单与引用元数据会互相矛盾。
        run: python scripts/ci_version_sync.py

      - name: Validate core package imports
        run: |
          pip install -e .
          python -c "import bioagent_core, bioagent; print('imports OK:', len(bioagent.REGISTRY), 'skills')"

      - name: Verify every registered skill exists on disk
        run: |
          python - <<'PY'
          from bioagent.registry import REGISTRY
          missing = [s.name for s in REGISTRY.values() if not s.skill_md.exists()]
          if missing:
              raise SystemExit(f"注册表中缺少 SKILL.md 的技能: {missing}")
          print(f"all {len(REGISTRY)} registered skills have SKILL.md")
          PY

      - name: Verify documentation index is in sync
        # 技能索引页 docs/skills/index.md 由 scripts/build_docs_index.py
        # 从各技能的 SKILL.md 自动生成。若不同步，说明有人改了
        # SKILL.md 的 description 却忘了重新生成索引。
        run: python scripts/build_docs_index.py --check

      - name: Static-check documentation site
        # 本机没有 Ruby，Jekyll 构建只能在 CI 里做，错误信息往往晦涩。
        # 这里在提交阶段就挑出可静态发现的问题：非白名单插件、
        # front matter 语法错误、站内断链。
        run: python scripts/ci_docs_check.py

      - name: Verify repository consistency
        # 跨文件的手工维护内容（README 徽章的技能数、技能清单、
        # REGISTRY 与磁盘的对应关系）最容易悄悄过时。这个检查把它们
        # 显式化，避免"文档说 8 个技能、实际有 9 个"这类漂移。
        run: python scripts/ci_consistency_check.py

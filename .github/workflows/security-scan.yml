name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    paths:
      - "skills/**"
      - "packages/**"
      - "scripts/**"

jobs:
  scan:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit core dependencies
        # 注意：GitHub Actions 的 run: 默认用 sh（dash）执行，不是 bash。
        # 因此这里必须使用 POSIX 兼容语法，不能用 IGNORE_ARGS=() 这类 bash 数组。
        #
        # 为什么用 scripts/ci_dependency_audit.py 而不是直接调 pip-audit：
        # pip-audit 默认审计整个环境，会把 editable 安装的项目自身
        # （biopipe-agent-skills，不发布到 PyPI）当成待审依赖而报
        # "Dependency not found on PyPI"，配合 --strict 必然失败。
        # 该脚本改为审计依赖清单，既保持严格又不误报。
        run: |
          set -e
          # 升级 pip 本身：审计工具链的旧版本会引入 pip 自身的漏洞告警
          # （PYSEC-2026-3721，修复于 pip 26.2），与项目依赖无关。
          python -m pip install --upgrade pip
          pip install -e .
          python scripts/ci_dependency_audit.py

      - name: Scan for hardcoded secrets
        run: |
          set -e
          echo "Scanning for credential patterns..."
          python scripts/ci_security_scan.py skills packages scripts

      - name: Verify no writes outside allowed dirs
        # 说明：早先这里用 shell 正则实现，但单双引号混用在 sh(dash) 下
        # 会直接语法错误。改用 Python 脚本，跨平台可靠。
        # 该检查是"报告式"的：列出可疑写入路径供人工复核，不阻断流水线。
        run: python scripts/ci_write_audit.py

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    paths:
      - "skills/**"
      - "packages/**"
      - "scripts/**"

jobs:
  scan:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit core dependencies
        # 注意：GitHub Actions 的 run: 默认用 sh（dash）执行，不是 bash。
        # 因此这里必须使用 POSIX 兼容语法，不能用 IGNORE_ARGS=() 这类 bash 数组。
        run: |
          set -e
          # 升级 pip 本身：审计工具链的旧版本会引入 pip 自身的漏洞告警
          # （PYSEC-2026-3721，修复于 pip 26.2），与项目依赖无关。
          python -m pip install --upgrade pip
          pip install -e .
          # --ignore-vuln 精确忽略 pip 自身的工具链告警；
          # 项目依赖的任何漏洞仍然会导致失败。
          if pip-audit --progress-spinner off --strict --ignore-vuln PYSEC-2026-3721; then
            echo "no known vulnerabilities in core dependencies"
          else
            echo "::error::pip-audit found vulnerabilities in core dependencies"
            echo "::error::请升级受影响依赖后重试"
            pip-audit --progress-spinner off --strict --ignore-vuln PYSEC-2026-3721
            exit 1
          fi

      - name: Scan for hardcoded secrets
        run: |
          set -e
          echo "Scanning for credential patterns..."
          python scripts/ci_security_scan.py skills packages scripts

      - name: Verify no writes outside allowed dirs
        run: |
          set -e
          PATTERN='open\s*\([^)]*["'"']w["'"']|Path\([^)]*\)\.write_'
          if grep -rInE "$PATTERN" skills packages --include='*.py' | grep -vE 'output|results|work|data|figures|tmp|cache'; then
            echo "::warning::Review writes outside standard output directories"
          fi

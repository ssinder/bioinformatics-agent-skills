name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    paths:
      - "skills/**"
      - "packages/**"
      - "scripts/**"

jobs:
  scan:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit core dependencies
        run: |
          pip install -e .
          # --ignore-vuln 可重复传入；用数组形式避免多次传参只保留最后一个。
          IGNORE_ARGS=()
          if pip-audit --progress-spinner off --strict; then
            echo "no known vulnerabilities"
          else
            echo "::warning::pip-audit reported findings, retrying with known-noise CVE ignored"
            IGNORE_ARGS+=(--ignore-vuln CVE-2023-45803)
            pip-audit --progress-spinner off --strict "${IGNORE_ARGS[@]}"

      - name: Scan for hardcoded secrets
        run: |
          set -e
          echo "Scanning for credential patterns..."
          python scripts/ci_security_scan.py skills packages scripts

      - name: Verify no writes outside allowed dirs
        run: |
          set -e
          PATTERN='open\s*\([^)]*["'"']w["'"']|Path\([^)]*\)\.write_'
          if grep -rInE "$PATTERN" skills packages --include='*.py' | grep -vE 'output|results|work|data|figures|tmp|cache'; then
            echo "::warning::Review writes outside standard output directories"
          fi

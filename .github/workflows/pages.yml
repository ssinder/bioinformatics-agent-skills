name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "skills/*/SKILL.md"
      - "scripts/build_docs_index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留一个部署任务，避免并发写入冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        # 说明：不要用 `gem install bundler` —— Ubuntu runner 的
        # /var/lib/gems 是系统目录，runner 用户无写权限，会报
        # Gem::FilePermissionError。ruby/setup-ruby 会把 bundler
        # 与依赖装到用户可写的目录。
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs

      - name: Regenerate skills index
        # 技能索引页是从 SKILL.md 自动生成的。
        # 构建前先重新生成一次，保证站点内容与代码一致。
        run: |
          set -e
          pip install pyyaml
          python scripts/build_docs_index.py
          # 真正的同步检查在 CI 的 skill-spec-validation 里做（会阻断），
          # 这里只提示，不阻断部署。
          git diff --quiet docs/skills/index.md || \
            echo "::warning::技能索引与 SKILL.md 不同步，请运行 python scripts/build_docs_index.py"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # 使用官方 Pages action，它只允许 GitHub Pages 白名单内的插件，
        # 与实际部署环境一致；本地自行 `jekyll build` 可能通过但线上会失败。
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

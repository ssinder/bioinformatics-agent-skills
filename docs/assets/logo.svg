<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 96" width="348" height="96" role="img" aria-label="BioinfoAgent Skills">
  <title>BioinfoAgent Skills</title>
  <defs>
    <linearGradient id="helixA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="helixB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="55%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- ===== Logo 图形：DNA 双螺旋 + 技能节点 ===== -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- 碱基对横档（梯子） -->
    <g stroke-linecap="round" stroke-width="2.4" opacity="0.42">
      <line x1="22" y1="18" x2="58" y2="18" stroke="#94A3B8"/>
      <line x1="18" y1="30" x2="62" y2="30" stroke="#94A3B8"/>
      <line x1="18" y1="42" x2="62" y2="42" stroke="#94A3B8"/>
      <line x1="22" y1="54" x2="58" y2="54" stroke="#94A3B8"/>
    </g>

    <!-- 双螺旋两条链 -->
    <path d="M18 12 C 58 24, 58 36, 40 40 C 22 44, 22 56, 62 68"
          fill="none" stroke="url(#helixA)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M62 12 C 22 24, 22 36, 40 40 C 58 44, 58 56, 18 68"
          fill="none" stroke="url(#helixB)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- 技能节点：3 个代表「技能包」的圆点 -->
    <circle cx="40" cy="26" r="5.4" fill="#0F766E" stroke="#F8FAFC" stroke-width="2"/>
    <circle cx="40" cy="40" r="5.4" fill="#6D28D9" stroke="#F8FAFC" stroke-width="2"/>
    <circle cx="40" cy="54" r="5.4" fill="#0F766E" stroke="#F8FAFC" stroke-width="2"/>
  </g>

  <!-- ===== 文字标 ===== -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="104" y="40" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="-0.4">BioinfoAgent</text>
    <text x="104" y="66" font-size="25" font-weight="300" fill="url(#wordmark)" letter-spacing="3.2">SKILLS</text>

    <!-- 副标签 -->
    <text x="104" y="84" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0.9">
      AGENT SKILLS FOR COMPUTATIONAL BIOLOGY
    </text>
  </g>
</svg>

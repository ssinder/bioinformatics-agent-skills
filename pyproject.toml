[build-system]
# setuptools>=77 支持 PEP 639 的 SPDX license 表达式与 license-files。
# 低版本会把 `license = "MIT"` 当作无效值而构建失败。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biopipe-agent-skills"
version = "1.0.0"
description = "Agent Skills for computational biology - RNA-seq, single-cell, structure analysis, molecular dynamics, and literature mining"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sinder", email = "senenenenes@163.com" }]
keywords = [
    "agent-skills",
    "bioinformatics",
    "computational-biology",
    "rna-seq",
    "single-cell",
    "molecular-dynamics",
    "protein-structure",
    "claude-skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    # Agent Skills 是本包的核心用途，PyPI 上还没有对应分类，
    # 只能用最贴近的类别标注，让检索者能通过 "Agent" 找到它。
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Natural Language :: English",
]

dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rna-seq = ["pandas>=1.5", "numpy>=1.23", "scipy>=1.9"]
single-cell = [
    "scanpy>=1.9",
    "anndata>=0.9",
    # leidenalg 0.12 声明支持 igraph>=1.0，但它实际仍调用 igraph 1.0
    # 已移除的 Weighted_AdjacencyMatrix —— 上游声明与实现不符，
    # 因此这里把 igraph 锁在 1.0 之前。
    "leidenalg>=0.10",
    "igraph<1.0",
]
structure = ["biopython>=1.80"]
visualization = ["matplotlib>=3.6", "seaborn>=0.12"]
literature = ["feedparser>=6.0", "python-dateutil>=2.8"]
all = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "biopython>=1.80",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scanpy>=1.9",
    "anndata>=0.9",
    "leidenalg>=0.10",
    "igraph<1.0",
    "feedparser>=6.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    # 打包测试要真的构建 wheel，因此需要 build
    "build>=1.0",
    # tomllib 是 3.11+ 的标准库；3.9 / 3.10 需要 tomli 才能解析 pyproject
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "h5py>=3.8",
    # 单细胞流程的 numpy 降级后端需要 sklearn（kNN / t-SNE / 聚类）
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    # MDAnalysis 2.8+ 要求 Python >= 3.10；Python 3.9 只能用 2.7.x
    "MDAnalysis>=2.6,<2.8; python_version < '3.10'",
    "MDAnalysis>=2.6; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/ssinder/bioinformatics-agent-skills"
Repository = "https://github.com/ssinder/bioinformatics-agent-skills"
Issues = "https://github.com/ssinder/bioinformatics-agent-skills/issues"
Discussions = "https://github.com/ssinder/bioinformatics-agent-skills/discussions"

[project.scripts]
bioagent = "bioagent.cli:main"
# 旧命令名保留一个版本周期的兼容入口。PyPI 上的 `biopipe` 包名与
# `biopipe` 控制台脚本已被第三方占用（dohlee/python-biopipe），
# 因此主命令改名为 `bioagent`；此别名仅用于平滑过渡。
biopipe = "bioagent.cli:main"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["bioagent_core*", "bioagent*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",
    # UP007 / UP045 建议把 Optional[X] / Union[X, Y] 改回 PEP 604 的 X | Y。
    # 但本项目支持 Python 3.9，而 `from __future__ import annotations` 只让
    # *注解不求值*；`typing.get_type_hints()` 会**强制求值**，此时
    # `str | None` 在 3.9 上抛 TypeError。
    # 因此这里显式禁用这两条规则，统一使用 typing 的兼容写法。
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"skills/**/scripts/*.py" = ["E402", "F401"]
"tests/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
